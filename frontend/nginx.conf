server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    # Docker DNS resolves a recreated API container without caching its old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend backend:3000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace client-supplied forwarded addresses; only this proxy is trusted.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api {
        proxy_pass http://$api_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
